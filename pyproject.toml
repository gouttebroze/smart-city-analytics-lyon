
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-city-lyon"
version = "0.1.0"
description = "Real-time Smart City Analytics platform for Lyon"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic-settings",
    "python-dotenv",
    "confluent-kafka",
    "psycopg[binary]",
    "sqlalchemy",
    "geoalchemy2",
    "pandas",
    "geopandas"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]
